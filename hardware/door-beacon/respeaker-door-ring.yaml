
substitutions:
  name: respeaker-door-ring
  friendly_name: Door Ring

  respeaker_ref: main

  door_topic: "doors/front-01/cmd"

  building_id: "2"
  door_id: "4"

  mqtt_broker: "192.168.88.219"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.6.0

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    version: recommended

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Door ring fallback"

api:
  actions:
    - action: set_ring_level
      variables:
        level: int
      then:
        - lambda: |-
            id(prox_level) = level < 0 ? 0 : (level > 12 ? 12 : level);
            id(prox_last_ms) = millis();
            ESP_LOGI("door_ring", "set_ring_level -> %d of 12", id(prox_level));
ota:
  - platform: esphome
    id: ota_esphome
    password: !secret ota_password

i2c:
  - id: internal_i2c
    sda: GPIO5
    scl: GPIO6
    scan: true
    frequency: 100kHz

external_components:
  - source:
      type: git
      url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration
      ref: ${respeaker_ref}
    components:
      - respeaker_xvf3800

respeaker_xvf3800:
  id: respeaker
  address: 0x2C
  dfu_version:
    name: "Firmware Version"
    update_interval: 120s
  firmware:
    url: https://github.com/formatBCE/Respeaker-XVF3800-ESPHome-integration/raw/${respeaker_ref}/application_xvf3800_inthost-lr48-sqr-i2c-v1.0.7-release.bin
    version: "1.0.7"
    md5: 043a848f544ff2c7265ac19685daf5de

esp32_ble_server:
  manufacturer_data: [0xFF, 0xFF, 0xAC, 0x01, 0x00, 0x02, 0x00, 0x04]

esp32_ble:
  name: "dr"

debug:
  update_interval: 30s

sensor:
  - platform: debug
    free:
      name: "Free heap"

globals:
  - id: prox_level
    type: int
    restore_value: false
    initial_value: '0'
  - id: prox_last_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: prox_flash_until_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

number:
  - platform: template
    name: "Ring brightness"
    id: ring_brightness
    optimistic: true
    min_value: 0.05
    max_value: 1.0
    step: 0.05
    initial_value: 0.6
    restore_value: true

interval:
  - interval: 100ms
    then:
      - lambda: |-
          static int last_drawn = -1;
          const uint32_t now = millis();

          if (id(prox_level) > 0 && (now - id(prox_last_ms)) > 3000) {
            id(prox_level) = 0;
          }

          const bool flashing = now < id(prox_flash_until_ms);
          const int lit = flashing ? 12 : std::min(id(prox_level), 12);
          const int key = flashing ? 99 : lit;
          if (key == last_drawn) return;
          last_drawn = key;

          uint32_t colors[12] = {0};
          const float master = id(ring_brightness).state;
          const uint32_t color = flashing
            ? ((uint32_t)(uint8_t)(255.0f * master) << 8)
            : (((uint32_t)(uint8_t)(200.0f * master) << 8) | (uint8_t)(60.0f * master));
          for (int i = 0; i < lit; i++) colors[i] = color;
          id(respeaker).set_led_ring(colors);

mqtt:
  broker: ${mqtt_broker}
  discovery: false
  birth_message:
  will_message:

  on_json_message:
    - topic: "${door_topic}/proximity"
      then:
        - lambda: |-
            const int levels = x["levels"];
            id(prox_level) = levels > 0 ? ((int) x["level"] * 12) / levels : 0;
            id(prox_last_ms) = millis();

    - topic: "${door_topic}"
      then:
        - lambda: |-
            if (x["action"] == "unlock") {
              id(prox_flash_until_ms) = millis() + 2000;
              id(prox_level) = 0;
            }
