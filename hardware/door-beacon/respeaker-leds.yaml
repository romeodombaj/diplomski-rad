# ReSpeaker XVF3800 — proximity LED ring
#
# NOT a standalone config. These blocks merge into ~/server/respeaker2.yaml.
# Written against that file as it stands: the ring there is NOT an ESPHome
# addressable light, it is the `respeaker_xvf3800` component driven by
# `id(respeaker).set_led_ring(uint32_t[12])`, dispatched from the 50ms
# `led_animation_interval` on the `current_led_effect` string (line ~399).
# Everything below follows that existing pattern rather than fighting it.
#
# ── What this is ────────────────────────────────────────────────────────────
#
#   door beacon (JOY-IT ESP32)  --BLE-->  phone
#   phone  --HTTP-->  backend  --MQTT-->  this device
#
# The ReSpeaker never touches Bluetooth. That is the point: putting BLE here
# costs internal RAM next to micro_wake_word and contends for the single S3
# radio (see respeaker-beacon-snippet.yaml). Receiving a number over WiFi costs
# neither, so the voice assistant is entirely unaffected.
#
# ── Nothing here opens a door ───────────────────────────────────────────────
#
# The ring is decoration. Access is decided by signature + TOTP + face +
# on-chain policy in the backend, which drives the lock on a separate topic.
# Unplug this device and access is unchanged; the phone's button is gated
# locally by its own BLE scan, so it works with the broker down too.
#
# ── Merge instructions ──────────────────────────────────────────────────────
# Each block below goes into the SAME-NAMED block that already exists in
# respeaker2.yaml. Do not add second copies of `globals:`, `script:` or
# `interval:` — YAML keeps only the last one and your voice assistant's LEDs
# would stop working.

# ── 0. Add to the existing `substitutions:` block ───────────────────────────
# `door_topic` MUST equal this door's `doors.mqtt_topic` in the backend, not a
# name you like — the backend publishes to whatever that column says.
substitutions:
  door_topic: "123"

# ── 1. Add to the existing `globals:` list (~line 189) ──────────────────────
globals:
  - id: prox_level
    type: int
    restore_value: false
    initial_value: '0'
  - id: prox_last_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'

# ── 2. Add to the existing `script:` list (~line 459, beside the other
#      update_*_effect scripts) ───────────────────────────────────────────────
script:
  - id: update_proximity_effect
    then:
      - lambda: |-
          constexpr int NUM_LEDS = 12;
          uint32_t colors[NUM_LEDS] = {0};

          int lit = id(prox_level);
          if (lit > NUM_LEDS) lit = NUM_LEDS;

          float master = id(user_led_ring_brightness).state;
          uint8_t g = (uint8_t)(200.0f * master);
          uint8_t r = (uint8_t)(0.0f   * master);
          uint8_t b = (uint8_t)(60.0f  * master);

          for (int i = 0; i < lit; i++) {
            colors[i] = (r << 16) | (g << 8) | b;
          }
          id(respeaker).set_led_ring(colors);

  # Full ring green for two seconds after a grant, then hand the ring back.
  - id: show_access_granted
    then:
      - lambda: |-
          uint32_t colors[12];
          float master = id(user_led_ring_brightness).state;
          uint32_t green = ((uint8_t)(255.0f * master) << 8);
          for (int i = 0; i < 12; i++) colors[i] = green;
          id(respeaker).set_led_ring(colors);
      - delay: 2s
      - lambda: |-
          id(prox_level) = 0;
          if (id(current_led_effect) == "proximity") id(current_led_effect) = "off";
          uint32_t colors[12] = {0};
          id(respeaker).set_led_ring(colors);

# ── 3. Add ONE branch to the existing dispatcher lambda (~line 408) ─────────
#
# Inside `led_animation_interval`, alongside the other `else if` arms:
#
#           } else if (effect == "proximity") {
#             id(update_proximity_effect).execute();
#
# Nothing else in that lambda changes.

# ── 4. Add to the existing `interval:` list (~line 399) ─────────────────────
# Decay. The ring must fade itself out when reports stop, because every way
# this ends is a way the phone cannot send a final zero: the user walks away,
# backgrounds the app, loses WiFi, or the battery dies. Absence is the only
# reliable signal, so absence is what clears the ring.
interval:
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: 'return id(prox_level) > 0 && (millis() - id(prox_last_ms)) > 3000;'
          then:
            - lambda: |-
                id(prox_level) = 0;
                if (id(current_led_effect) == "proximity") id(current_led_effect) = "off";
                uint32_t colors[12] = {0};
                id(respeaker).set_led_ring(colors);

# ── 5. New top-level block: MQTT ────────────────────────────────────────────
# ESPHome runs `mqtt:` and `api:` side by side, so Home Assistant keeps working.
# Point this at the same broker as the backend's MQTT_URL (mosquitto/), and set
# `door_topic` to this door's `doors.mqtt_topic` in the backend.
# Values are inline rather than `!secret` because respeaker2.yaml has no
# secrets.yaml — it inlines its wifi ssid and ota password too. Keep that style.
mqtt:
  # The machine running docker compose. Anonymous, per mosquitto.conf.
  broker: "192.168.88.219"
  username: ""
  password: ""
  # This device only listens. Publishing its whole entity list to the broker the
  # access system runs on is noise nobody reads.
  discovery: false
  birth_message:
  will_message:

  on_json_message:
    # Somebody is approaching. Payload from mqttService.publishProximity.
    - topic: ${door_topic}/proximity
      then:
        - lambda: |-
            int level  = x["level"];
            int levels = x["levels"];
            // Rescale the backend's step count onto this ring's 12 LEDs, so the
            // two never have to agree on a number.
            id(prox_level) = levels > 0 ? (level * 12) / levels : 0;
            id(prox_last_ms) = millis();

            // Yield to the voice assistant. If it is showing anything at all,
            // leave the ring alone: someone walking past matters less than the
            // feedback for what they are saying, and two writers on one ring
            // just flicker against each other.
            if (id(prox_level) > 0 && id(current_led_effect) == "off"
                && !id(volume_display_active)) {
              id(current_led_effect) = "proximity";
            }

    # The door actually opened. Payload from mqttService.publishUnlock.
    - topic: ${door_topic}
      then:
        - if:
            condition:
              lambda: 'return x["action"] == "unlock";'
            then:
              - script.execute: show_access_granted
