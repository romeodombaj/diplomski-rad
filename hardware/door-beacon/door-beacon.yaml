# Door proximity beacon — standalone ESPHome firmware
#
# Flash this to a dedicated ESP32 (the JOY-IT ESP32 / any esp32-s3-devkitc-1
# class board). One per door.
#
# WHAT IT DOES: advertises this door's identity over BLE, continuously, and
# nothing else. The phone scans, hears it, reads the signal strength, and
# decides locally that the user is standing at this door — no network round
# trip, so the "Verify for Door N" button lights up instantly.
#
# WHAT IT DOES NOT DO: it never touches the lock, never talks to the backend,
# and carries no secret. Per specs/HARDWARE_ACCESS_NOTES.md the BLE gate is a
# UX convenience, NOT a security boundary — a modified app could claim any
# door_id from anywhere. The real trust boundary is the backend's authorisation
# check plus face + TOTP, all enforced server-side. Anyone who flashes this
# firmware learns nothing they could not read off the door itself.
#
# Deliberately NOT scanning. The design notes describe the door also scanning
# for the phone to drive an RSSI->LED display; that is cosmetic, it gates
# nothing, and BLE scanning is the operation that most disrupts WiFi on a
# single-radio ESP32. Advertising alone is a low duty cycle and coexists well.
#
#   esphome run door-beacon.yaml
#
# ── Per-door configuration ──────────────────────────────────────────────────
# Change these three values for each door, and nothing else.
substitutions:
  door_name: "main-01"
  # Must match `buildings.id` in the backend.
  building_id: "1"
  # Must match `doors.id` in the backend. The phone maps (major, minor) back to
  # a door_code using the list it received at enrolment.
  door_id: "1"

esphome:
  name: door-beacon-${door_name}
  friendly_name: "Door beacon ${door_name}"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: INFO

# WiFi is here only for over-the-air updates and logs. The beacon itself does
# not need a network — pull this block and it still advertises. If the door has
# no WiFi coverage, delete `wifi:`, `api:` and `ota:` and flash over USB.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Door beacon ${door_name}"

api:
ota:
  - platform: esphome

# ── The beacon ──────────────────────────────────────────────────────────────
# DO NOT use `esp32_ble_beacon` here. It was tried and it never transmits on
# ESPHome 2026.8: the component sets its payload with
# esp_ble_gap_config_adv_data_raw() and only calls start_advertising() when the
# resulting ADV_DATA_RAW_SET_COMPLETE event arrives — but it first checks a flag
# that ESPHome's advertising scheduler clears whenever the rotation returns to
# the name advertisement, so the start call is dropped without a word. Confirmed
# from a phone: every frame from the board's MAC arrived with the device name
# and manufacturerData null, over many full cycles, at both 1s and the default
# 10s advertising_cycle_time.
#
# `esp32_ble_server`'s manufacturer_data rides in the ordinary advertisement,
# which is broadcast continuously with no rotation and no async handshake to
# lose. Verified working end to end.
#
# ── Payload (8 bytes) ───────────────────────────────────────────────────────
#   FF FF   company id 0xFFFF — the id reserved for testing / no company
#   AC 01   marker: Access Control, format version 1
#   hi lo   building_id, big-endian   → buildings.id
#   hi lo   door_id, big-endian       → doors.id
#
# A full iBeacon frame is 25 bytes and, with the flags and a device name, breaks
# BLE's 31-byte advertisement limit. This carries the same two facts in eight.
# The phone maps (building_id, door_id) back to a door_code using the door list
# it received at enrolment — see mobile-app/src/lib/beacon.ts, which still
# accepts real iBeacons too.
#
# EDIT THESE TWO BYTE PAIRS for each door. They must match the `doors` row.
esp32_ble_server:
  manufacturer_data: [0xFF, 0xFF, 0xAC, 0x01, 0x00, 0x01, 0x00, 0x01]

esp32_ble:
  # Short on purpose: the advertisement must hold flags, tx power, the
  # manufacturer data above and this name within 31 bytes.
  name: "dr"

# A visible heartbeat, so it is obvious at a glance that a door beacon is alive
# without connecting anything to it.
output:
  - platform: gpio
    pin: GPIO2
    id: status_led_output

light:
  - platform: binary
    name: "Status"
    output: status_led_output
    internal: true
    id: status_led

interval:
  - interval: 3s
    then:
      - light.turn_on: status_led
      - delay: 80ms
      - light.turn_off: status_led
