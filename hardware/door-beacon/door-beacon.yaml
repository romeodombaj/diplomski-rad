substitutions:
  door_name: "main-01"
  building_id: "1"
  door_id: "1"

esphome:
  name: door-beacon-${door_name}
  friendly_name: "Door beacon ${door_name}"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Door beacon ${door_name}"

api:
ota:
  - platform: esphome

esp32_ble_server:
  manufacturer_data: [0xFF, 0xFF, 0xAC, 0x01, 0x00, 0x01, 0x00, 0x01]

esp32_ble:
  name: "dr"

output:
  - platform: gpio
    pin: GPIO2
    id: status_led_output

light:
  - platform: binary
    name: "Status"
    output: status_led_output
    internal: true
    id: status_led

interval:
  - interval: 3s
    then:
      - light.turn_on: status_led
      - delay: 80ms
      - light.turn_off: status_led
