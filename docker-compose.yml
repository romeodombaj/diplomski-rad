
name: diplomski-rad

services:
  chain:
    build:
      context: ./blockchain
    container_name: dr-chain
    ports:
      - "${CHAIN_PORT:-8545}:8545"
    volumes:
      - chain-deployments:/app/deployments
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/deployments/localhost.json && curl -fsS -X POST -H 'Content-Type: application/json' --data '{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}' http://127.0.0.1:8545 >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  broker:
    image: eclipse-mosquitto:2
    container_name: dr-broker
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t healthcheck -E -W 3 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

  backend:
    build:
      context: ./backend
    container_name: dr-backend
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    depends_on:
      chain:
        condition: service_healthy
      broker:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000

      TZ: ${TZ:-Europe/Zagreb}

      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-only-change-me-too}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      CHAIN_RPC_URL: http://chain:8545
      CHAIN_NETWORK: localhost
      CHAIN_DEPLOYMENT_FILE: /chain/localhost.json
      CHAIN_BACKEND_PRIVATE_KEY: ${CHAIN_BACKEND_PRIVATE_KEY:-0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80}
      CHAIN_REQUIRED: ${CHAIN_REQUIRED:-true}

      MQTT_URL: mqtt://broker:1883
      MQTT_CLIENT_ID: access-backend

      BEHAVIOR_ENGINE_URL: ${BEHAVIOR_ENGINE_URL-http://behavior:8000}

      DEVICE_SCAN_SUBNET: ${DEVICE_SCAN_SUBNET:-}
      PROXIMITY_LEVELS: ${PROXIMITY_LEVELS:-12}
      ACCESS_REQUIRE_FACE: ${ACCESS_REQUIRE_FACE:-true}
      ACCESS_FACE_THRESHOLD: ${ACCESS_FACE_THRESHOLD:-0.7}
    volumes:
      - backend-data:/app/data
      - chain-deployments:/chain:ro
    restart: unless-stopped

  behavior:
    build:
      context: ./behavior-engine
    container_name: dr-behavior
    ports:
      - "${BEHAVIOR_PORT:-8000}:8000"
    environment:
      TZ: ${TZ:-Europe/Zagreb}
    volumes:
      - behavior-models:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    container_name: dr-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
  mosquitto-data:
  behavior-models:
  chain-deployments:
