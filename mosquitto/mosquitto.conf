# MQTT broker for the door relays.
#
# The backend publishes an unlock to each door's own topic (doors.mqtt_topic);
# per specs/HARDWARE_ACCESS_NOTES.md that currently drives a WiFi smart plug
# whose audible click stands in for a real lock.

listener 1883
protocol mqtt

# WebSocket listener, so a browser can subscribe to door topics directly —
# useful for watching an unlock land during a demo without a native client.
listener 9001
protocol websockets

# ANONYMOUS ACCESS IS ON, and that is a development choice, not a default to
# carry anywhere real: anyone who can reach port 1883 can publish an unlock to
# any door topic, bypassing every check the backend performs. On a real install
# this needs a password file and per-topic ACLs, and the broker must not be
# reachable from outside the building's network.
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
