server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Without this, nginx resolves `backend` ONCE at
    # startup and caches that IP for the life of the process — so recreating the
    # backend container (which gives it a new IP) leaves the dashboard returning
    # 502 on every API call until nginx is restarted too, even though the
    # backend is perfectly healthy. `valid=10s` re-resolves instead.
    #
    # It only takes effect when the upstream is a variable: a literal
    # `proxy_pass http://backend:5000` is still resolved at startup. Hence the
    # $backend below, and the explicit $request_uri that a variable upstream
    # requires (nginx does not append the matched URI in that form).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:5000;

    # The dashboard is a single-page app behind react-router. Without this,
    # refreshing on /people or /audit-logs asks nginx for a file that does not
    # exist and returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same split the vite dev proxy uses: the API lives under /api, and auth
    # (login, buildings, operators) under /auth.
    location /api/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Chain writes wait on a block; a grant or an offboard can legitimately
        # take longer than nginx's 60s default.
        proxy_read_timeout 120s;
    }

    location /auth/ {
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed asset filenames, so they can be cached indefinitely. index.html
    # deliberately is not — it is what points at the current hashes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
